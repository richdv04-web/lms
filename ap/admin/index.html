.gate{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px}.gate.on{display:flex}
.gate .gc{width:100%;max-width:340px;text-align:center}.gate .ey2{font-size:12px;letter-spacing:.2em;color:var(--mut);margin-bottom:10px;font-weight:600}
.gate h2{margin:0 0 26px;font-size:30px;font-weight:300;letter-spacing:-.04em}.gate .ge{min-height:20px;color:#CF6B6B;font-size:13px;margin:2px 0 8px}
.gate .pl{width:100%;justify-content:center;height:46px;font-size:14.5px}.gate .fld{text-align:center;font-size:16px;letter-spacing:.08em;margin-bottom:6px}.gate .hint{margin-top:16px;font-size:12px;color:var(--faint)}
.fld{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--ln2);background:var(--card2);color:var(--fg);font:inherit;font-size:14px;outline:0}.fld:focus{border-color:var(--fg)}
textarea.fld{min-height:230px;line-height:1.65;resize:vertical;font-variant-numeric:tabular-nums}
.sm-sec{margin-top:20px;padding-top:18px;border-top:1px solid var(--ln)}.sm-sec h4{margin:0 0 4px;font-size:14.5px;font-weight:700;letter-spacing:-.02em}
.sm-sec .d{font-size:12.5px;color:var(--mut);line-height:1.6;margin-bottom:10px}.sm-sec .d b{color:var(--fg);font-weight:600}
.sm-row{display:flex;gap:8px;align-items:center}.sm-row>*{flex:1}.sm-row .pl{flex:none}
.smp{font-size:12.5px;color:var(--mut);line-height:1.65;margin:10px 0 12px}.smp b{color:var(--fg)}.smp .er{color:#CF6B6B;display:block}
.sm-badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 9px;border-radius:99px;background:var(--card2);color:var(--mut);margin-bottom:6px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:14px;background:var(--card2)}.sw b{font-size:14px;font-weight:600}.sw span{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.sw i{position:relative;flex:none;width:46px;height:28px;border-radius:99px;background:var(--gr);transition:background .15s;cursor:pointer}.sw i:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}.sw i.on{background:var(--pill)}.sw i.on:after{transform:translateX(18px);background:var(--onpill)}
.pl.full{width:100%;justify-content:center;height:44px}.pl.pri[disabled]{opacity:.35;pointer-events:none}


html[data-theme=dark]{--bg:#0B0B0C;--fg:#FFFFFF;--mut:#8C8C8E;--faint:#5E5E60;--gr:#2A2A2C;--ln:rgba(255,255,255,.12);--ln2:rgba(255,255,255,.26);--ac:#9A8BE8;--acT:#B3A8F0}
html[data-theme=light]{--bg:#F4F4F2;--ln:rgba(13,13,13,.13)}
:root{--ff:'Manrope','Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;--mw:760px}
body:before,body:after{display:none}
.top{background:color-mix(in srgb,var(--bg) 86%,transparent);border-bottom:1px solid var(--ln)}
.top .in{height:56px}
.wm{font-size:12.5px;letter-spacing:.34em}
.wrap{padding:8px 22px 96px}

.gl{background:transparent!important;border:0!important;border-top:1px solid var(--ln)!important;border-radius:0!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.grp{padding:22px 0 20px}
.mx{padding:26px 0 6px}.mlist{padding:18px 0 6px}
.dd{padding:24px 0 6px}

.hdr{margin:30px 0 8px;align-items:flex-end}
.hdr .eh .ey{display:flex;gap:14px;font-size:12px;font-weight:600;letter-spacing:.2em;color:var(--mut);margin-bottom:14px}
.hdr .eh .ey div:first-child{color:var(--fg)}

    h+='<div class="gl mlist" style="margin-top:14px">'+(rs.length?rs.map(function(r){return (r.contracts||r.mip)?'<div class="rw2"><span class="nm0">'+esc(r.name)+tags(r)+'</span><span class="c"><b>'+r.contracts+'</b>건</span><span class="m"><b>'+won(r.mip)+'</b>만원</span></div>':'<div class="rw2"><span class="nm0">'+esc(r.name)+tags(r)+'</span><span class="z">예상 없음</span></div>'}).join(''):'<div class="none" style="padding:6px 0 18px">아직 입력이 없어요</div>')+'</div>'}
  h+=notes(b);return h}
boot();
</script></body></html>
